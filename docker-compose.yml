services:

  # ── Streaming backbone ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sensor-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: sensor-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: sensor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ── Lake storage (Iceberg = MinIO for data + Postgres for the JDBC catalog) ─
  minio:
    image: minio/minio:latest
    container_name: sensor-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/lakehouse
      "

  postgres:
    image: postgres:16
    container_name: sensor-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Sensor data generator ───────────────────────────────────────────────────
  generator:
    build:
      context: ./generator
    container_name: sensor-generator
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: sensor-readings
      NUM_DEVICES: "5"
      INTERVAL_SECONDS: "2"

  # ── Flink cluster ────────────────────────────────────────────────────────
  flink-jobmanager:
    image: sensor-flink-job
    build:
      context: ./flink-job
      dockerfile: docker/Dockerfile
    container_name: sensor-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        execution.checkpointing.interval: 30000

  flink-taskmanager:
    image: sensor-flink-job
    build:
      context: ./flink-job
      dockerfile: docker/Dockerfile
    container_name: sensor-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        execution.checkpointing.interval: 30000

  # ── Flink job submitter (submits + resubmits on failure) ────────────────────
  sensor-job:
    image: sensor-flink-job
    build:
      context: ./flink-job
      dockerfile: docker/Dockerfile
    container_name: sensor-flink-job
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./flink-job/config:/opt/flink-job/config
    environment:
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ICEBERG_DB: iceberg_catalog
      ICEBERG_JDBC_USER: iceberg
      ICEBERG_JDBC_PASSWORD: iceberg
      ICEBERG_WAREHOUSE: s3://lakehouse/
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      /bin/bash -c "
        while true; do
          while ! curl -sf http://flink-jobmanager:8081/overview > /dev/null; do sleep 5; done
          OUTPUT=$$(flink run --detach -m flink-jobmanager:8081 -c dev.ibrahim.sensors.job.SensorPipelineJob /opt/flink-job/sensor-flink-job-1.0-SNAPSHOT.jar 2>&1)
          echo \"$$OUTPUT\"
          JOB_ID=$$(echo \"$$OUTPUT\" | grep -oE 'JobID [0-9a-f]+' | awk '{print $$2}')
          if [ -z \"$$JOB_ID\" ]; then
            echo 'Sensor pipeline job submission failed, retrying in 30s...'
            sleep 30
            continue
          fi
          echo \"Submitted $$JOB_ID, monitoring...\"
          while curl -sf http://flink-jobmanager:8081/overview > /dev/null; do
            STATE=$$(curl -sf http://flink-jobmanager:8081/jobs/$$JOB_ID 2>/dev/null | awk -F'\"state\":\"' '{print $$2}' | cut -d'\"' -f1)
            if [ \"$$STATE\" = 'FAILED' ]; then
              echo \"Job $$JOB_ID FAILED, resubmitting...\"
              break
            fi
            sleep 30
          done
        done
      "

volumes:
  minio-data:
  postgres-data:
